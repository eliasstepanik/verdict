[package]
name = "verdict-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
verdict = { path = ".." }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
serde_json = "1"

[[bin]]
name = "verdict"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
