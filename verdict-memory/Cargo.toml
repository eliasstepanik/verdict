[package]
name = "verdict-memory"
version = "0.1.0"
edition = "2021"

[features]
default = []
sqlite = ["rusqlite"]

[dependencies]
verdict = { path = ".." }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dependencies.rusqlite]
version = "0.31"
optional = true
features = ["bundled"]
